apiVersion: 1

# Faz o Grafana carregar automaticamente qualquer dashboard .json
# que estiver nesta pasta, toda vez que o container sobe.
providers:
  - name: Bluesky
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
